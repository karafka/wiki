name: Sync GitHub Wiki

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sync-github-wiki
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    environment: automatic-content-refresh
    steps:
      - name: Checkout docs repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wiki

      - name: Checkout GitHub Wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: karafka/karafka.wiki
          path: wiki/.gh
          token: ${{ secrets.REPO_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'

      - name: Configure Git
        working-directory: wiki/.gh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync content to GitHub Wiki
        working-directory: wiki
        run: bin/sync_gh
